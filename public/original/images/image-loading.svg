<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">图片正在赶来</title>
  <desc id="description">一架纸飞机把一张照片送到学习卡片上</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1edff"/><stop offset="1" stop-color="#e2f8f2"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f79e6"/><stop offset="1" stop-color="#5bc7b4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#63579c" flood-opacity=".17"/></filter>
  </defs>
  <rect width="640" height="360" rx="30" fill="url(#sky)"/>
  <g fill="none" stroke="#c8bdf7" stroke-linecap="round" stroke-width="4" opacity=".66"><path d="M74 83c28-28 65-23 74 2 8 22-18 36-38 24-23-14-7-41 20-34" stroke-dasharray="7 12"/><path d="M486 65c32-19 70-3 61 24-7 21-39 17-41-3-2-16 19-22 31-11" stroke-dasharray="7 12"/></g>
  <g fill="#fff" opacity=".75"><circle cx="100" cy="248" r="7"/><circle cx="536" cy="260" r="10"/><circle cx="565" cy="128" r="5"/><circle cx="170" cy="76" r="5"/></g>
  <g filter="url(#shadow)" transform="rotate(-7 319 176)">
    <rect x="186" y="82" width="270" height="190" rx="22" fill="#fff"/><rect x="204" y="101" width="234" height="125" rx="15" fill="url(#photo)"/>
    <path d="M204 201l56-51 38 33 41-47 99 90H204z" fill="#d5fff6" opacity=".9"/><circle cx="365" cy="142" r="18" fill="#fff7a8"/>
    <path d="M204 226h234v27H204z" fill="#fff8e6"/><path d="M228 244h92" stroke="#a49cc1" stroke-linecap="round" stroke-width="8"/><path d="M336 244h55" stroke="#d2cced" stroke-linecap="round" stroke-width="8"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(449 177) rotate(-15)"><path d="M0 19 84 0 52 69 36 37z" fill="#ffdd78" stroke="#d69259" stroke-linejoin="round" stroke-width="4"/><path d="m36 37 16 32 5-42z" fill="#fff4ca"/><path d="M36 37 84 0 0 19z" fill="#fff9dc"/><animateTransform attributeName="transform" type="translate" values="449 177;462 166;449 177" dur="1.8s" repeatCount="indefinite"/></g>
  <path d="M438 206c20 8 30 18 38 33" fill="none" stroke="#ef9e83" stroke-linecap="round" stroke-width="4" stroke-dasharray="5 10"><animate attributeName="stroke-dashoffset" values="0;-30" dur="1s" repeatCount="indefinite"/></path>
  <g transform="translate(247 302)"><rect width="146" height="10" rx="5" fill="#d9d3ef"/><rect width="42" height="10" rx="5" fill="#826cda"><animate attributeName="width" values="34;105;34" dur="1.65s" repeatCount="indefinite"/></rect></g>
  <text x="320" y="337" fill="#625b86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" text-anchor="middle">图片正在赶来</text>
